# Mensajes de las reglas de cambio (SC-003). {0} = médico afectado, {1} = fecha (dd/MM/yyyy).
regla.CG-005=La guardia del {1} ya no es de {0}.
regla.CG-006={0} no tiene guardia el {1}.
regla.CG-008=La guardia del {1} no es posterior a hoy: solo se pueden ceder o cambiar guardias futuras.
regla.CG-009=La guardia del {1} que se recibe a cambio no es posterior a hoy.
regla.CG-011={0} ya tiene otra guardia el {1}.
regla.CG-012={0} está de vacaciones el {1}.
regla.CG-013={0} tiene guardia de presencia el {1}, día consecutivo a la presencia que recibiría.
# {2} = el otro médico del cambio.
regla.CG-014={0} y {2} no son del mismo tipo de médico el {1}.
regla.CG-015.inactivo={0} no está activo.
regla.CG-015.noMiembro={0} no pertenece al servicio.
regla.MISMO_MEDICO=El médico que cede y el que recibe son la misma persona ({0}).
# Reglas de vacaciones (002 SC-004). {0} = médico, {1} = fecha (dd/MM/yyyy), {2} = tipo de guardia.
regla.VAC-003={0} tiene guardia de {2} el {1} en este servicio: no se puede marcar ese día como vacaciones.
regla.VAC-008=El {1} es anterior a hoy: no se pueden añadir ni quitar vacaciones de días pasados.
