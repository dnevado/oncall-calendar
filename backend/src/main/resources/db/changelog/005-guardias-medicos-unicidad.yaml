# Un médico, una guardia por día y servicio (FR-025, R8). Prefijo de 10 caracteres porque
# FGuardia es varchar(1000) y las fechas tienen formato yyyy-MM-dd.
# Se detiene si quedan duplicados: la limpieza previa requiere autorización explícita.
databaseChangeLog:
  - changeSet:
      id: 005-guardias-medicos-unicidad
      author: guardias-001
      preConditions:
        - onFail: HALT
        - onFailMessage: >
            Hay médicos con más de una guardia el mismo día y servicio. Ejecutar antes el
            diagnóstico de deploy/db/limpieza-duplicados.sql y la corrección confirmada.
        - sqlCheck:
            expectedResult: 0
            sql: >
              SELECT COUNT(*) FROM (SELECT IdMedico FROM guardias_medicos
              GROUP BY IdMedico, LEFT(FGuardia, 10), IdServicio HAVING COUNT(*) > 1) d
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX UX_GUARDIA_MEDICO_DIA
              ON guardias_medicos (IdMedico, FGuardia(10), IdServicio)
      rollback:
        - sql: { sql: DROP INDEX UX_GUARDIA_MEDICO_DIA ON guardias_medicos }
