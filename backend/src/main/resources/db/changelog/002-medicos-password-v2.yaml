# Columnas del login nuevo en medicos (R2, R15). El login legacy no las usa.
databaseChangeLog:
  - changeSet:
      id: 002-medicos-password-v2
      author: guardias-001
      changes:
        - addColumn:
            tableName: medicos
            columns:
              - column: { name: PasswordHashV2, type: varchar(255) }
              - column: { name: PasswordHashV2Origen, type: varchar(128) }
              - column: { name: LoginFallidosV2, type: int }
              - column: { name: BloqueadoHastaV2, type: datetime }
