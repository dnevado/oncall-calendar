# SPA bajo /app/ (base de Vite y basename de React Router). Las rutas del cliente vuelven a
# index.html; los ficheros con hash se pueden cachear sin límite.
server {
    listen 80;
    root /usr/share/nginx/html;

    location = /app {
        return 301 /app/;
    }

    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /app/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app/index.html;
    }
}
