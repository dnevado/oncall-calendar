# SPA bajo /app/ (base de Vite y basename de React Router). Las rutas del cliente vuelven a
# index.html; los ficheros con hash se pueden cachear sin límite.
#
# Cabeceras de seguridad (revisión T068, I3). Se repiten en cada location porque un add_header
# dentro de una location anula los del server.
# - frame-ancestors / X-Frame-Options: nadie puede cargar la aplicación en un iframe (clickjacking).
# - style-src 'unsafe-inline': FullCalendar inserta su CSS con un <style> desde JavaScript.
# - Todo lo demás, solo del propio origen; la API va por el mismo dominio (/api/, R1).
server {
    listen 80;
    root /usr/share/nginx/html;

    location = /app {
        return 301 /app/;
    }

    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /app/ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ /app/index.html;
    }
}
