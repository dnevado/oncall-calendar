openapi: 3.0.3
info:
  title: Guardias — Cambios y cesiones, y vacaciones
  version: 1.2.0-draft
  description: |
    Contrato de las funcionalidades 001 (specs/001-registro-cambios-guardia) y 002
    (specs/002-gestion-vacaciones). Todas las operaciones salvo el login exigen sesión; las de
    servicio exigen rol de administrador de ese servicio (001 FR-001, 002 FR-001). Los errores usan
    Problem Details (RFC 7807).
    1.2.0: añade las operaciones de vacaciones y los códigos VAC-003 y VAC-008 en Infraccion
    (cambio compatible: solo añade).
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: guardias
  - name: cambios
  - name: vacaciones

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión con las credenciales del legacy
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada; fija la cookie de sesión y el token CSRF
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesión
      operationId: logout
      responses:
        '204': { description: Sesión cerrada }

  /auth/me:
    get:
      tags: [auth]
      summary: Usuario actual y servicios que administra
      operationId: me
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /servicios/{servicioId}/guardias:
    get:
      tags: [guardias]
      summary: Guardias del servicio en un rango de fechas
      operationId: listarGuardias
      parameters:
        - $ref: '#/components/parameters/ServicioId'
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Guardias ordenadas por fecha
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Guardia' }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /servicios/{servicioId}/guardias/{guardiaId}/receptores-candidatos:
    get:
      tags: [guardias]
      summary: Médicos que pueden recibir esta guardia (ayuda de interfaz, FR-017)
      description: |
        Orientativo: el alta vuelve a validar todas las reglas en el servidor.
        En un CAMBIO se indica la fecha destino para devolver solo médicos con guardia ese día.
      operationId: listarReceptoresCandidatos
      parameters:
        - $ref: '#/components/parameters/ServicioId'
        - { name: guardiaId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: tipo, in: query, required: true, schema: { $ref: '#/components/schemas/TipoCambio' } }
        - { name: fechaDestino, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Candidatos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Candidato' }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /servicios/{servicioId}/cambios:
    get:
      tags: [cambios]
      summary: Cambios registrados en un rango de fechas
      operationId: listarCambios
      parameters:
        - $ref: '#/components/parameters/ServicioId'
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Cambios ordenados por fecha de registro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Cambio' }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [cambios]
      summary: Registrar y aplicar un cambio o una cesión (FR-002)
      description: |
        Valida todas las reglas y aplica el cambio en una única transacción (FR-021).
        Si alguna regla falla devuelve 422 con todas las infracciones (FR-016) y no modifica nada.
        Para corregir un cambio erróneo se registra el inverso (FR-028).
      operationId: registrarCambio
      parameters:
        - $ref: '#/components/parameters/ServicioId'
        - name: Idempotency-Key
          in: header
          required: false
          description: Si se repite con la misma clave, devuelve el cambio original sin aplicar nada.
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarCambioRequest' }
      responses:
        '201':
          description: Cambio registrado y aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cambio' }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: La Idempotency-Key ya se usó con una petición distinta
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: El cambio incumple una o más reglas
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ReglasIncumplidas' }

  /servicios/{servicioId}/vacaciones:
    get:
      tags: [vacaciones]
      summary: Vacaciones de los médicos del servicio en un rango de fechas (002 FR-012, FR-013, FR-014)
      description: |
        Devuelve todos los médicos dados de alta en el servicio, activos o inactivos, con sus días
        de vacaciones en el rango (también los que no tienen ninguno). Cada día indica si coincide
        con una guardia del médico en el servicio (conflicto). Con `medicoId`, solo ese médico.
        Las vacaciones son del médico: son las mismas en todos sus servicios (VAC-006).
      operationId: listarVacaciones
      parameters:
        - $ref: '#/components/parameters/ServicioId'
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - name: hasta
          in: query
          required: true
          description: Como mucho 731 días después de `desde` (límite técnico).
          schema: { type: string, format: date }
        - name: medicoId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Médicos ordenados por apellidos y nombre, con sus días ordenados por fecha
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VacacionesMedico' }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /servicios/{servicioId}/medicos/{medicoId}/vacaciones:
    patch:
      tags: [vacaciones]
      summary: Añadir y quitar días de vacaciones de un médico (002 FR-003 a FR-011)
      description: |
        Aplica en una única transacción los días que se añaden y los que se quitan; el resto de
        vacaciones del médico no cambia (VAC-007). Si algún día incumple una regla devuelve 422 con
        todas las infracciones y no modifica nada (FR-006, FR-011). Añadir un día que ya existe o
        quitar uno que no existe no es un error (FR-007): repetir la petición da el mismo resultado.
      operationId: modificarVacaciones
      parameters:
        - $ref: '#/components/parameters/ServicioId'
        - name: medicoId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificarVacacionesRequest' }
      responses:
        '200':
          description: Cambios aplicados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoVacaciones' }
        '400': { $ref: '#/components/responses/PeticionInvalida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422':
          description: Algún día incumple una regla
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ReglasIncumplidas' }

components:
  parameters:
    ServicioId:
      name: servicioId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    PeticionInvalida:
      description: Petición mal formada
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NoAutenticado:
      description: Sin sesión o credenciales incorrectas
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Prohibido:
      description: El usuario no administra este servicio (CG-002)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NoEncontrado:
      description: Guardia o médico inexistente en el servicio (en vacaciones, médico que no pertenece al servicio)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    Usuario:
      type: object
      required: [id, nombre, serviciosAdministrados]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        serviciosAdministrados:
          type: array
          items:
            type: object
            required: [id, nombre]
            properties:
              id: { type: integer, format: int64 }
              nombre: { type: string }

    TipoCambio:
      type: string
      enum: [CAMBIO, CESION]

    TipoGuardia:
      type: string
      description: "RESIDENTE corresponde al valor '' del esquema legacy."
      enum: [PRESENCIA, LOCALIZADA, REFUERZO, RESIDENTE]

    MedicoResumen:
      type: object
      required: [id, nombre]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, description: Nombre y apellidos }

    Guardia:
      type: object
      required: [id, fecha, tipo, festivo, medico]
      properties:
        id: { type: integer, format: int64 }
        fecha: { type: string, format: date }
        tipo: { $ref: '#/components/schemas/TipoGuardia' }
        festivo: { type: boolean }
        medico: { $ref: '#/components/schemas/MedicoResumen' }

    Candidato:
      type: object
      required: [medico]
      properties:
        medico: { $ref: '#/components/schemas/MedicoResumen' }
        guardiaDestinoId:
          type: integer
          format: int64
          description: Solo en CAMBIO, la guardia del candidato en la fecha destino.

    RegistrarCambioRequest:
      type: object
      required: [tipo, guardiaOrigenId, cedenteId, receptorId]
      properties:
        tipo: { $ref: '#/components/schemas/TipoCambio' }
        guardiaOrigenId: { type: integer, format: int64 }
        cedenteId:
          type: integer
          format: int64
          description: Médico que se espera que tenga la guardia origen; si ya no la tiene, falla CG-005.
        receptorId: { type: integer, format: int64 }
        guardiaDestinoId:
          type: integer
          format: int64
          description: Obligatorio en CAMBIO (guardia del receptor); prohibido en CESION.

    Cambio:
      type: object
      required: [id, tipo, fechaOrigen, cedente, receptor, guardiaOrigen, registradoPor, registradoEn]
      properties:
        id: { type: integer, format: int64 }
        tipo: { $ref: '#/components/schemas/TipoCambio' }
        fechaOrigen: { type: string, format: date }
        fechaDestino:
          type: string
          format: date
          description: Solo en CAMBIO.
        cedente: { $ref: '#/components/schemas/MedicoResumen' }
        receptor: { $ref: '#/components/schemas/MedicoResumen' }
        guardiaOrigen:
          $ref: '#/components/schemas/GuardiaAntes'
        guardiaDestino:
          $ref: '#/components/schemas/GuardiaAntes'
        registradoPor: { $ref: '#/components/schemas/MedicoResumen' }
        registradoEn: { type: string, format: date-time }

    GuardiaAntes:
      type: object
      description: Tipo y festivo de la guardia tal como eran antes del cambio (FR-003, FR-023).
      required: [tipo, festivo]
      properties:
        tipo: { $ref: '#/components/schemas/TipoGuardia' }
        festivo: { type: boolean }

    VacacionesMedico:
      type: object
      required: [medico, activo, dias]
      properties:
        medico: { $ref: '#/components/schemas/MedicoResumen' }
        activo: { type: boolean, description: Activo en el servicio (los inactivos también se gestionan) }
        dias:
          type: array
          items: { $ref: '#/components/schemas/DiaVacaciones' }

    DiaVacaciones:
      type: object
      required: [fecha]
      properties:
        fecha: { type: string, format: date }
        conflicto:
          $ref: '#/components/schemas/Guardia'
          description: Guardia del médico en el servicio ese mismo día, si la hay (002 FR-014).

    ModificarVacacionesRequest:
      type: object
      description: |
        Al menos una de las dos listas con algún día. Una misma fecha no puede estar en las dos
        listas. Como mucho 366 fechas en cada lista (límite técnico).
      properties:
        anadir:
          type: array
          maxItems: 366
          uniqueItems: true
          items: { type: string, format: date }
        quitar:
          type: array
          maxItems: 366
          uniqueItems: true
          items: { type: string, format: date }

    ResultadoVacaciones:
      type: object
      required: [anadidos, quitados]
      properties:
        anadidos:
          type: array
          description: Días que no eran de vacaciones y ahora lo son.
          items: { type: string, format: date }
        quitados:
          type: array
          description: Días que eran de vacaciones y ya no lo son.
          items: { type: string, format: date }

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    ReglasIncumplidas:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [infracciones]
          properties:
            infracciones:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/Infraccion' }

    Infraccion:
      type: object
      required: [regla, mensaje]
      properties:
        regla:
          type: string
          description: Código de la regla del catálogo.
          enum: [CG-005, CG-006, CG-008, CG-009, CG-011, CG-012, CG-013, CG-014, CG-015, MISMO_MEDICO, VAC-003, VAC-008]
        mensaje: { type: string, description: Texto comprensible para el administrador (SC-003) }
        medicoId: { type: integer, format: int64 }
        fecha: { type: string, format: date }
